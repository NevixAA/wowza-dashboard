name: Sync from v9

# This repo is the SLIM deployment of the Wowza dashboard. Every code file in it is a copy of a file
# in NevixAA/wowza-betting (v9), listed in v9's deploy/dashboard_manifest.json. Hand-maintained
# copies drifted (Data Truth audit 2026-11-01: 29 files differed from v9 main and 6 that v9's
# manifest lists were missing, including src/integrity/data_truth.py, so System Health reported
# "Data truth checks failed"). So the copy is now automatic:
#
#   1. check out v9 main read-only,
#   2. build the slim tree with v9's OWN generator (scripts/build_dashboard_repo.py), which copies
#      exactly the manifest's code files plus the generated README / BUILD_INFO / .gitignore,
#   3. mirror it over this repo with --delete, so a file v9 drops from the manifest (stale,
#      pipeline-only) disappears here too. .git and .github (this workflow) are kept,
#   4. commit only when a code or manifest file changed. BUILD_INFO.json and README.md carry a
#      build timestamp, so on their own they are not a reason to commit,
#   5. push; if main moved meanwhile, never rebase the generated commit (README.md / BUILD_INFO.json
#      always conflict): reset to the new main, rebuild from the same v9 checkout, re-commit only on a
#      real change, push again (5 attempts, never forced). Steps 2-5 are .github/scripts/sync_from_v9.sh.
#
# The concurrency group runs one sync at a time, but a queued run is created against the main SHA of
# its event, not the tip when it starts. So the slim checkout pins ref: main (the tip at job start), and
# the push in step 5 heals the rest (2026-11-24 16:21: two dispatches 40 s apart, the second started on
# the pre-push SHA, its pull --rebase conflicted and the loop retried on unmerged files until it failed).
#
# Never edit files here by hand: fix them in wowza-betting and let this run (or dispatch it).

on:
  schedule:
    - cron: '17 * * * *'      # hourly; v9 code changes a few times a day at most
  workflow_dispatch:
  repository_dispatch:
    types: [v9-main-updated]

concurrency:
  group: sync-from-v9
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main     # the tip when the job starts, not the (older) SHA a queued event was created on
          path: slim

      - name: Check out v9 main (read-only)
        uses: actions/checkout@v4
        with:
          repository: NevixAA/wowza-betting
          ref: main
          path: _v9
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build, mirror, commit if code changed, push (self-healing)
        run: |
          git -C slim config user.name  "github-actions[bot]"
          git -C slim config user.email "github-actions[bot]@users.noreply.github.com"
          # run a copy: the script resets slim/ to a newer main on retry, which must not rewrite it mid-run
          cp slim/.github/scripts/sync_from_v9.sh "$RUNNER_TEMP/sync_from_v9.sh"
          bash "$RUNNER_TEMP/sync_from_v9.sh" _v9 slim "$RUNNER_TEMP/build" 5
